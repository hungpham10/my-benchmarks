# Prometheus vs PostgreSQL for metric storage and querying.
#
# Three services, and only two of them are under test: Prometheus and
# PostgreSQL. The third runs the ingest pass and the query suite, one after
# the other, so the two databases are never competing for the same cores
# while a measurement is being taken.
#
# Both systems get an IDENTICAL resource envelope: ${TARGET_CPUS} CPUs and
# ${TARGET_MEMORY} each, out of the 4 vCPU / 10 GB the VM provides. This is
# what makes the comparison a comparison. Uncapped, Prometheus could spend
# three times the RAM PostgreSQL uses and still be declared the winner, and
# "peak memory" would measure the ceiling of the machine rather than of either
# design. The leftover core and ~2 GB go to the bench runner and the OS.
#
# Consequence to keep in mind when reading results: a query that OOMs or
# starves on CPU is a real property of "what fits in this envelope", not a
# measurement artefact. That is the number a reader actually cares about.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: bench-prometheus
    deploy:
      resources:
        limits:
          cpus: "${TARGET_CPUS}"
          memory: ${TARGET_MEMORY}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # No block-range flag: it was removed upstream. The head chunk range is
      # now min-block-duration (default 2h, which is what the compaction maths
      # assumes), and block ranges are ExponentialBlockRanges(min, 10, 3) --
      # 2h, 6h, 18h, 54h. Retention moved to prometheus.yml because
      # --storage.tsdb.retention.time is deprecated.
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --query.max-samples=50000000
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: bench-postgres
    deploy:
      resources:
        limits:
          cpus: "${TARGET_CPUS}"
          memory: ${TARGET_MEMORY}
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # PostgreSQL 18 moved the data directory under a version-specific
      # subdirectory, so the mount point moved up one level. Mounting at
      # /var/lib/postgresql/data makes the image treat the volume as unused and
      # refuse to start.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Ingest pass (INGEST_TARGETS) and query suite. One service, one image, two
  # commands: the caller picks the script, so the phases stay sequential.
  bench:
    build: .
    container_name: bench-runner
    profiles: ["ingest", "bench"]
    environment:
      PROM_URL: http://prometheus:9090
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: bench
      PG_PASSWORD: bench
      PG_DATABASE: bench
      JOBS: "${JOBS}"
      INSTANCES_PER_JOB: "${INSTANCES_PER_JOB}"
      INTERVAL_SECONDS: "${INTERVAL_SECONDS}"
      WINDOW_MINUTES: "${WINDOW_MINUTES}"
      AHEAD_MINUTES: "${AHEAD_MINUTES}"
      SEED: "${SEED}"
      JITTER_MS: "${JITTER_MS:-0}"
      TARGETS: "${INGEST_TARGETS:-all}"
      SERIES_CHUNK: "${SERIES_CHUNK:-1000}"
      SCRAPES_PER_REQUEST: "${SCRAPES_PER_REQUEST:-240}"
      QUERY_ITERATIONS: "${QUERY_ITERATIONS}"
      QUERY_WARMUP: "${QUERY_WARMUP}"
      QUERY_TIMEOUT_S: "${QUERY_TIMEOUT_S:-120}"
      RESULTS_DIR: /results
    volumes:
      - ./results:/results
    depends_on:
      prometheus:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # --- Monitoring ---------------------------------------------------------
  #
  # Opt-in via `--profile monitoring`, and deliberately NOT part of a measured
  # run unless asked for. It exists so a run can be judged on two axes: which
  # database is faster (results/) and what doing that cost the machine (this).
  #
  # The hard rule: monitoring never writes into the TSDB of the Prometheus under
  # test. That TSDB is the thing being measured at 4.67 B/sample against
  # Postgres at 279.76; one scraped target added to it would move the headline
  # number. So Alloy remote-writes to a separate Prometheus with its own volume.

  # Per-container CPU and memory for the systems under test.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: bench-cadvisor
    profiles: ["monitoring"]
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    restart: unless-stopped

  # Metrics for the systems under test, plus the host itself.
  alloy:
    image: grafana/alloy:latest
    container_name: bench-alloy
    profiles: ["monitoring"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/${ALLOY_CONFIG:-config.alloy}
    volumes:
      - ./monitoring/alloy:/etc/alloy:ro
      # Root and /sys so prometheus.exporter.unix can read host CPU, memory and
      # disk. The docker socket is deliberately absent: cAdvisor reports on every
      # container already, so Alloy has no reason to talk to the Docker API.
      - /:/rootfs:ro
      - /sys:/sys:ro
      - alloy-data:/var/lib/alloy/data
    # Grafana Cloud credentials, when monitoring/.env.monitoring exists. Alloy
    # reads them with sys.env(); config.alloy never mentions them, so a missing
    # file is the normal case and not an error.
    env_file:
      - path: ./monitoring/.env.monitoring
        required: false
    environment:
      # Identity of the run, stamped onto every sample by a relabel rule. Empty
      # by default, which removes the label rather than writing an empty one.
      # The Makefile fills these in; CI fills them from the run number and SHA.
      - BENCH_RUN_ID=${BENCH_RUN_ID:-}
      - BENCH_COMMIT=${BENCH_COMMIT:-}
    depends_on:
      monitoring-prometheus:
        condition: service_healthy
      cadvisor:
        condition: service_started
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    restart: unless-stopped

  # Storage for the operational metrics. Separate from the Prometheus under
  # test, on purpose.
  monitoring-prometheus:
    image: prom/prometheus:latest
    container_name: bench-monitoring-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      # Alloy remote_writes here. Prometheus refuses remote write unless this is
      # set, and the failure is a 404 that looks like a bad URL rather than a
      # missing flag.
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - mon-prom-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Postgres operational metrics. Needs pg_stat_statements, which the target
  # Postgres already loads via shared_preload_libraries.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: bench-postgres-exporter
    profiles: ["monitoring"]
    command:
      - --collector.stat_statements
      - --collector.stat_activity
      - --collector.stat_database
      - --collector.stat_wal_receiver
    environment:
      DATA_SOURCE_URI: "postgres:5432/bench?sslmode=disable"
      DATA_SOURCE_USER: bench
      DATA_SOURCE_PASS: bench
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Dashboards, provisioned from disk.
  grafana:
    image: grafana/grafana:latest
    container_name: bench-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      monitoring-prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prom-data:
  pg-data:
  alloy-data:
  mon-prom-data:
  grafana-data:
