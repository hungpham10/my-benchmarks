# Storage for the benchmark's own operational metrics.
#
# Deliberately a SEPARATE Prometheus from the one under test, with its own
# volume. Scraping ~2k series into the TSDB being measured would change the
# headline disk number, which is the whole point of the comparison.
#
# This one is not measured, so it gets no --query.max-samples tuning and no
# retention worth discussing.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    source: benchmark-monitoring

scrape_configs:
  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]

# Alloy remote_writes here; Alloy does not scrape this one itself.
