id: smoke
systems: [prometheus]
shape: counter
scale: smoke
load:
  executor: ramping-arrival-rate
  start_rate: 1
  time_unit: 1s
  stages:
    - { target: 1, duration: 10s }
    - { target: 5, duration: 20s }
  graceful_ramp_down: 5s
thresholds:
  p95_ms: 5000
timeout_min: 10
dataset:
  jobs: 2
  instances_per_job: 5
  interval_seconds: 15
  window_minutes: 15
  ahead_minutes: 8
  seed: 20240101
  query: 'sum(rate(http_requests_total[5m]))'
