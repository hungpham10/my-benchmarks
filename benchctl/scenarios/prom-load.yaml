id: prom-load
systems: [prometheus]
shape: counter
scale: medium

# CCU here means req/s under the OPEN model (ramping-arrival-rate):
# k6 generates exactly N requests/s whether or not the server keeps up.
# When it cannot, dropped_iterations > 0 marks the breaking point.
# A closed model (fixed VUs) would slow itself down and hide the break.
load:
  executor: ramping-arrival-rate
  start_rate: 10
  time_unit: 1s
  stages:
    - { target: 10,  duration: 1m }
    - { target: 200, duration: 8m }
    - { target: 2000, duration: 5m }
  graceful_ramp_down: 30s

thresholds:
  p95_ms: 500

timeout_min: 45

# Dataset: 20k series x 180 samples = 3.6M samples, 15s interval.
# Volume comes from cardinality, not window length: Prometheus cannot be
# backfilled more than ~1h, so a longer window is not loadable.
dataset:
  jobs: 20
  instances_per_job: 500
  interval_seconds: 15
  window_minutes: 45
  ahead_minutes: 8
  seed: 20240101
  query: 'sum(rate(http_requests_total[5m]))'

# What CI needs to run this scenario: the job's budget, how long the
# results are kept, and whether the runner needs the filesystem tooling.
ci:
  job_timeout_minutes: 60
  artifact_days: 90
