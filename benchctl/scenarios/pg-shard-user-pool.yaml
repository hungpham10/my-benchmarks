# The modulo key's REAL job: choosing the connection pool.
#
# This is the app architecture under test — user_id % P picks pool p;
# pool p == schema s_p == one users table; a connection that belongs to
# pool p never touches another schema. The benefit claimed for this is
# transaction isolation, not IO: a burst of hot users only queues behind
# its own pool, while every other pool keeps signing users up.
#
# The legs vary P (1 / 8 / 32) with conns=16 fixed, so the total
# connection budget is 16 / 128 / 512 and — the part that matters — the
# queueing domain shrinks with it. Each leg's VU budget is exactly
# P * conns (gen_plan caps max_vus), so k6 plays the role of the app's
# pools faithfully: one connection per VU, VU i in pool (i-1) % P.
#
# Expected shape: P=1 is the baseline single-pool PG (everything queues
# behind one spec); the curve drops going to 8 or 32 — and the point of
# the curve is that it flattens, telling the app how many pools it
# actually needs. Mode none and gin both ride along: the pool effect and
# the per-row write cost are separate axes.
#
# On the SAME filesystem (plain docker volume) — the pool question is a
# connection question first; the FS question is pg-shard-user-fs.

id: pg-shard-user-pool
systems: [postgres/userdb]
shape: counter
scale: large

legs:
  - {layout: C, mode: none, pools: 1,  conns: 16}
  - {layout: C, mode: none, pools: 8,  conns: 16}
  - {layout: C, mode: none, pools: 32, conns: 16}
  - {layout: C, mode: gin,  pools: 8,  conns: 16}

envelope:
  cpus: "4"
  memory: 8G
  k6_cpus: "1"
  k6_memory: 1G

load:
  executor: ramping-arrival-rate
  start_rate: 50
  time_unit: 1s
  stages:
    - { target: 200, duration: 30s }
    - { target: 400, duration: 1m }
  graceful_ramp_down: 15s

thresholds:
  p95_ms: 500

timeout_min: 90

env:
  N_USERS: "10000000"
  QBENCH_MEASURE: "30"
  CONNS_DEFAULT: "16"

dataset:
  jobs: 20
  instances_per_job: 500
  interval_seconds: 15
  window_minutes: 45
  ahead_minutes: 8
  seed: 20240101

ci:
  job_timeout_minutes: 150
  artifact_days: 180
