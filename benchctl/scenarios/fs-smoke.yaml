# Filesystem matrix, tiny. Exists to prove the machinery works: it formats
# real filesystems on the runner, mounts them, and runs the same database on
# each. A PR check that only exercises the Prometheus path would let the
# filesystem path rot until a nightly run noticed.
#
# Two filesystems, not four: the point is that the code path works, not that
# the matrix is complete. A full matrix is scenarios/fs-matrix.yaml.

id: fs-smoke
systems: [postgres/jsonb]
filesystems: [ext4, btrfs]
shape: counter
scale: smoke

load:
  executor: ramping-arrival-rate
  start_rate: 1
  time_unit: 1s
  stages:
    - { target: 1, duration: 10s }
    - { target: 5,  duration: 20s }
  graceful_ramp_down: 5s

thresholds:
  p95_ms: 5000

timeout_min: 10

env:
  QBENCH_MEASURE: "3"
  QBENCH_BUDGET_S: "10"

dataset:
  jobs: 2
  instances_per_job: 5
  interval_seconds: 15
  window_minutes: 15
  ahead_minutes: 8
  seed: 20240101

queries:
  postgres/jsonb:
    query: q1_counter_rate
    table: metrics_jsonb
