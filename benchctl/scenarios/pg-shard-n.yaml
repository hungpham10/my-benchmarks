# The number-of-shards knee, application-side.
#
# sharding.yaml sweeps declarative partitions and measures the SQL read
# path (Parallel Append). This scenario sweeps the app-side equivalent:
# how many physical tables does a user_id % N router want, and where does
# more start to hurt (too many forks for shared_buffers, too many
# microwrites for the filesystem, TOAST spread)? Layout B-I1 only; N is
# the leg dimension.
#
# Expect the bulk COPY to win going 16 -> 32 (page contention out of one
# relfilenode) and flatten past 64 (the writer's own connection pool is
# the bottleneck, and each fork's hot page count drops under the cache
# watermark). If the knee flat is at 16, the plan's N=32 default was
# conservative; if it keeps climbing, the pipe between library and file
# cache is doing more work than the database.

id: pg-shard-n
systems: [postgres/modshard]
shape: counter
scale: medium

legs:
  - {layout: B, index: I1, shards: 16}
  - {layout: B, index: I1, shards: 32}
  - {layout: B, index: I1, shards: 64}

envelope:
  cpus: "4"
  memory: 8G
  k6_cpus: "1"
  k6_memory: 1G

load:
  executor: ramping-arrival-rate
  start_rate: 10
  time_unit: 1s
  stages:
    - { target: 10,  duration: 30s }
    - { target: 200, duration: 1m }
  graceful_ramp_down: 15s

thresholds:
  p95_ms: 500

timeout_min: 60

env:
  QBENCH_MEASURE: "10"
  QBENCH_BUDGET_S: "45"

dataset:
  jobs: 20
  instances_per_job: 500
  interval_seconds: 15
  window_minutes: 45
  ahead_minutes: 8
  seed: 20240101

queries:
  postgres/modshard:
    query: q1_counter_rate
    table: events_all

ci:
  job_timeout_minutes: 120
  artifact_days: 90
