# Filesystem loadtest: one database, four filesystems.
#
# The question is not "which database is faster" — it is "where should this
# database's data directory live". Everything except the filesystem is held
# constant: same image, same dataset, same envelope, same queries, same
# order of operations. The only thing that changes between legs is the
# filesystem the data directory sits on.
#
# What is expected to move:
#   - the write path (bulk COPY during init, WAL fsyncs, checkpoints)
#   - fsync latency, measured directly by pg_test_fsync on the data dir
#   - space used, because btrfs and ZFS do not store files the way ext4 does
#
# What is expected NOT to move much: read latency with a warm cache. The
# working set fits in RAM, so reads come from the page cache and the
# filesystem is not involved. That is worth measuring rather than
# assuming — "the filesystem does not matter for reads" is a useful
# result, and it only becomes useful if it was measured.
#
# And because of exactly that, the scenario also runs the read path twice:
# warm (the cache serves it) and cold (the container restarted, the host
# page cache dropped, so the read has to reach the filesystem). The cold
# numbers are the ones where the filesystem is on the critical path.
#
# Adding another database is one line: add it to `systems` below and the
# legs become <database> x <filesystem>. The leg slug, the parity check
# and the report table all key off that pair.
#
# The second database layout lives in its own scenario (fs-norm.yaml) and
# runs on its own runner: the filesystems of one scenario have to share a
# disk to be comparable, and two scenarios want two runners.
#
# tmpfs is deliberately NOT in the list. It would be the baseline that
# answers "what does the disk cost?", but its pages are charged to the
# container's memory limit like any other memory, and at this dataset size
# the data and the WAL alone do not fit inside the envelope. A baseline
# that needs a different envelope is not a baseline. The code for it is in
# shared/fssetup.py if a smaller dataset ever wants it.
#
# f2fs is the fifth filesystem: log-structured, checkpointing instead of
# journaling, built for flash. If the runner cannot format it, the matrix
# records the gap and the leg is skipped — a gap, not a failed run.

id: fs-jsonb
systems: [postgres/jsonb]
filesystems: [ext4, xfs, btrfs, zfs, f2fs]
shape: counter
scale: medium

# Shorter than the main scenario: four legs, and the load phase is a read
# workload that the page cache serves. The write path is the init.
load:
  executor: ramping-arrival-rate
  start_rate: 10
  time_unit: 1s
  stages:
    - { target: 10,  duration: 30s }
    - { target: 200, duration: 2m }
    - { target: 500, duration: 2m }
  graceful_ramp_down: 30s

thresholds:
  p95_ms: 500

timeout_min: 90

# Four legs have to fit in the CI budget, so the query sweep is shorter than
# the default. Same queries, fewer iterations.
env:
  QBENCH_MEASURE: "10"
  QBENCH_BUDGET_S: "45"

# Same dataset as the main scenario, so the numbers are comparable with the
# Prometheus-vs-PostgreSQL chapter. 20k series x 180 samples = 3.6M samples.
dataset:
  jobs: 20
  instances_per_job: 500
  interval_seconds: 15
  window_minutes: 45
  ahead_minutes: 8
  seed: 20240101

queries:
  postgres/jsonb:
    query: q1_counter_rate
    table: metrics_jsonb

# The longest scenario: four legs, each with a bulk load, a query sweep, a
# load phase and a cold-cache phase. It also needs the filesystem tooling
# on the runner, and its results are the evidence behind a published
# chapter, so they are kept longer.
ci:
  job_timeout_minutes: 120
  artifact_days: 180
  fs_tools: true
