# Does removing the WAL wait make index maintenance visible?
#
# The sizing post's index table says the write tax of every access method
# stays under 4% on ext4, and explains it with: the transaction waits for
# one WAL flush either way. If that explanation is right, the tax should
# grow when the flush is no longer what the transaction waits on — that is,
# with synchronous_commit=off. If it does not grow, the explanation is
# wrong and the table's "why" needs rewriting.
#
# Only the access methods whose maintenance is expensive are here: BRIN as
# the cheap control, GiST and SP-GiST (picksplit/split work), GIN (pending
# list flush). Each pair is adjacent (on, off) for the same reason as the
# FS legs: drift across a long job is larger than the effect.
#
# Separate scenario, not legs appended to pg-idxlab-ext4: that job already
# runs eight 10M-row legs against a 280-minute ceiling, and doubling it
# would trade the question for a timeout.

id: pg-config-index
systems: [postgres/idxlab]

legs:
  - {ix: brin_time,    conns: 16, idxlab: 1}
  - {ix: brin_time,    conns: 16, idxlab: 1, sync: "off"}
  - {ix: gist_point,   conns: 16, idxlab: 1}
  - {ix: gist_point,   conns: 16, idxlab: 1, sync: "off"}
  - {ix: spgist_point, conns: 16, idxlab: 1}
  - {ix: spgist_point, conns: 16, idxlab: 1, sync: "off"}
  - {ix: gin_trgm,     conns: 16, idxlab: 1}
  - {ix: gin_trgm,     conns: 16, idxlab: 1, sync: "off"}

envelope:
  cpus: "4"
  memory: 8G
  k6_cpus: "1"
  k6_memory: 1G

# Same closed loop as the index lab: 16 VUs == 16 connections.
load:
  executor: constant_vus
  duration: 90s

thresholds:
  p95_ms: 2000

timeout_min: 200

env:
  N_USERS: "10000000"
  QBENCH_MEASURE: "20"

size_gb: 40

dataset:
  jobs: 20
  instances_per_job: 500
  interval_seconds: 15
  window_minutes: 45
  ahead_minutes: 8
  seed: 20240101

ci:
  job_timeout_minutes: 300
  artifact_days: 180
