# Application-side modulo sharding: which physical layout wins?
#
# The sibling of sharding.yaml, which asks the same number-of-shards
# question for declarative partitions and the SQL query path. This
# scenario asks the write-path question instead: when the application
# fans its inserts out over N physical tables by user_id % N, what does
# each layout cost at bulk-load time on a constant filesystem?
#
# The legs are the plan's A/B/C/D matrix:
#   A: one table, btree (series_id, time)          — baseline
#   B: N tables events_XX, routed user_id % N      — the claim, write path
#   C: N tables spread over 8 schemas              — does schema placement
#      change anything? (PostgreSQL puts every relfilenode in
#      base/<dboid>/ regardless of schema, so the working answer is no;
#      the leg exists to beat that answer out of assumption)
#   D+N jsonb payload with GIN jsonb_ops (I3) vs jsonb_path_ops off
#      fastupdate (I4) — the GIN pending-list question
#   E: declarative PARTITION BY HASH on series_id
#
# What moves between legs: the bulk COPY time (GIN maintenance, TOAST
# churn, page distribution), bytes_on_disk (TOAST per shard), and the read
# shapes through the events_all UNION view.
#
# What does NOT move: dataset, envelope, filesystem (plain docker volume),
# k6 read leg, thresholds. The filesystem matrix is its own scenario
# (pg-shard-fs.yaml) because the two questions multiply to a leg count a
# runner cannot host in one job.

id: pg-shard-layouts
systems: [postgres/modshard]
shape: counter
scale: medium

legs:
  - {layout: A, index: I1}
  - {layout: B, index: I1}
  - {layout: C, index: I1}
  - {layout: E, index: I1}
  - {layout: D, index: I3}
  - {layout: D, index: I4}

envelope:
  cpus: "4"
  memory: 8G
  k6_cpus: "1"
  k6_memory: 1G

load:
  executor: ramping-arrival-rate
  start_rate: 10
  time_unit: 1s
  stages:
    - { target: 10,  duration: 30s }
    - { target: 200, duration: 1m }
  graceful_ramp_down: 15s

thresholds:
  p95_ms: 500

timeout_min: 60

# Writes are measured by the init COPY, not by k6; the query sweep runs at
# the fs-jsonb cadence so the read numbers stay comparable with it.
env:
  QBENCH_MEASURE: "10"
  QBENCH_BUDGET_S: "45"
  SHARD_N: "32"
  BENCHCTL_PARALLEL_WORKERS: "4"

dataset:
  jobs: 20
  instances_per_job: 500
  interval_seconds: 15
  window_minutes: 45
  ahead_minutes: 8
  seed: 20240101

queries:
  postgres/modshard:
    query: q1_counter_rate
    table: events_all

ci:
  job_timeout_minutes: 120
  artifact_days: 180
