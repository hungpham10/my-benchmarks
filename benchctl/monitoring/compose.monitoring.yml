# Static monitoring stack. Never generated, never per-leg.
#
# Hard rule (inherited from the old harness): nothing here writes into the
# TSDB of the system under test. That TSDB is the thing being measured; one
# scraped target added to it would corrupt the bytes-per-sample headline.
# Everything lands in monitoring-prometheus (local) and optionally Cloud.
#
# The SUT joins via the external network `benchctl-mon`, which the driver
# creates once. Alloy reaches it as benchctl-sut:9090 regardless of which
# module is under test — which is why cAdvisor + this works identically for
# every module, even ones that expose no /metrics of their own.
services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: benchctl-cadvisor
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - mon
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: benchctl-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/${ALLOY_CONFIG:-config.local.alloy}
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      - BENCH_RUN_ID=${BENCH_RUN_ID:-}
      - BENCH_MODULE=${BENCH_MODULE:-}
      - GRAFANA_CLOUD_RW_URL=${GRAFANA_CLOUD_RW_URL:-}
      - GRAFANA_CLOUD_RW_USER=${GRAFANA_CLOUD_RW_USER:-}
      - GRAFANA_CLOUD_RW_PASS=${GRAFANA_CLOUD_RW_PASS:-}
    depends_on:
      monitoring-prometheus:
        condition: service_healthy
    networks:
      - mon
    restart: unless-stopped

  monitoring-prometheus:
    image: prom/prometheus:latest
    container_name: benchctl-monitoring-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - mon-prom-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Fixed and out of the way: verify/ runs on the host and queries this
      # for the server-side request count. Nothing measured listens here.
      - "19091:9090"
    networks:
      - mon
    restart: unless-stopped

volumes:
  alloy-data:
  mon-prom-data:

networks:
  mon:
    name: benchctl-mon
    external: true
