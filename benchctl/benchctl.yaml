# benchctl — small benchmark framework.
# The envelope is the measurement: every module gets the same budget.
envelope:
  cpus: "1"
  memory: 4G
  k6_cpus: "1"
  k6_memory: 1G
  k6_max_vus: 500

# Filesystem matrix (scenarios/fs-matrix.yaml). The image file per
# filesystem is sparse, so size_gb is a ceiling, not an allocation.
fs:
  size_gb: 12

# Grafana Cloud: every metric from every module carries module + run_id.
# The framework never merges numbers itself; Cloud holds the curves.
cloud:
  remote_write_url: "${GRAFANA_CLOUD_RW_URL:-}"
  username: "${GRAFANA_CLOUD_RW_USER:-}"
  password: "${GRAFANA_CLOUD_RW_PASS:-}"

run:
  run_id: "${BENCH_RUN_ID:-local}"
