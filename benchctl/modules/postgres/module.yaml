# Module contract (5 functions; no module registers without all 5):
#   deploy()    -> containers up, healthy, endpoint returned
#   init()      -> load data for (scale, shape), return {samples, bytes_on_disk}
#   start_load()-> open write path, return write handle
#   stop_load() -> flush + close, MUST guarantee durable before returning
#   teardown()  -> volumes removed
#
# What the module owns: image, flags, healthcheck, init data, ONE k6 step
# (built via xk6-sql + driver), requests.py for server-side query count,
# and query_marker (rendered SQL from scenario) so verify can filter
# pg_stat_statements to only the bench's queries.
# What the framework owns: envelope, stages, thresholds, plan.json, compose.

name: postgres
image: postgres:latest

# The driver calls observe.py readshapes for this module.
capabilities: [readshapes]

deploy:
  command:
    - postgres
    - -c
    - shared_buffers=1GB
    - -c
    - work_mem=8MB
    - -c
    - maintenance_work_mem=256MB
    - -c
    - max_wal_size=2GB
    - -c
    - min_wal_size=512MB
    - -c
    - track_io_timing=on
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - max_connections=100
    # max_parallel_workers_per_gather is not set here on purpose. A
    # command-line -c beats postgresql.auto.conf, so the loader could
    # never raise it again for the sharding scenario. The loader sets it
    # instead: 0 by default, and whatever the scenario asks for otherwise.
    #
    # Why 0 by default: on one CPU a parallel plan buys nothing and costs
    # reproducibility. PostgreSQL's parallel workers allocate dynamic
    # shared memory in /dev/shm, which is 64 MB by default in Docker and is
    # charged to the container's memory limit. On a heavy query the
    # allocation fails with "could not resize shared memory segment: No
    # space left on device" and takes the whole k6 step down with it. One
    # thread also means the filesystem comparison is not measured through a
    # scheduler lottery.
    - -c
    - log_min_messages=warning
  # Docker's /dev/shm is 64 MB by default, and it counts against the
  # container's memory limit. Give it room so that a session that does
  # allocate shared memory fails for a real reason, not for a 64 MB default.
  shm_size: "512m"
  config_files:
    - src: init/01_schema.sql
      dst: /docker-entrypoint-initdb.d/01_schema.sql
  data_volume: { name: sut-data, dst: /var/lib/postgresql }
  ports:
    - { env: PG_PORT, default: "15432", container: 5432 }
  environment:
    POSTGRES_USER: bench
    POSTGRES_PASSWORD: bench
    POSTGRES_DB: bench
    POSTGRES_INITDB_ARGS: "--data-checksums"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
    interval: 5s
    timeout: 3s
    retries: 20
  endpoint: "localhost:{PG_PORT}"
  disk_path: /var/lib/postgresql

k6:
  # Uses shared benchctl-k6 image (built once with xk6-sql + postgres driver)
  max_vus: 32
  env:
    PG_DSN: "postgres://bench:bench@sut:5432/bench?sslmode=disable"

# Server-side request accounting + sample stats.
# The driver (run.py) reads pg_stat_statements and data tables via
# modules/postgres/observe.py.
# query_marker is a SQL fragment that the verify check uses to narrow the
# count to only the bench's queries (so we don't count VACUUM, PL/pgSQL,
# or unrelated ad-hoc queries). For postgres, we filter by the table name
# that appears in the rendered SQL.
query_marker: "query LIKE '%metrics_jsonb%' OR query LIKE '%metrics_norm_brin%'"

# observe.py exposes server_requests(filter_sql) and sample_stats(variant).
requests_module: modules/postgres/observe.py