# Prometheus under a ramping load, to its breaking point.
#
# One scenario, one workflow file. The pipeline it calls lives in
# benchmark.yml; this file is the entry point and the place where the
# scenario's own budget is decided.

name: prom-load

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Open a PR with the results
        type: boolean
        default: false

jobs:
  bench:
    uses: ./.github/workflows/benchmark.yml
    with:
      scenario: prom-load
      publish: ${{ inputs.publish }}
      timeout_minutes: 60
      artifact_days: 90
    secrets: inherit
