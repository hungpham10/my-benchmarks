# CodeQL analysis.
#
# Not here for its own sake: the `release` ruleset on this repository requires a
# CodeQL scan with zero `errors`-level alerts before anything can merge, and the
# scan has to actually be configured or every PR blocks on it.
#
# Python is the code that matters here. `actions` is scanned because the
# workflows in this repo run shell with credentials and pull images.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 01:30 UTC. Catches advisories published after the last
    # commit, which is the case a push-triggered scan never sees.
    - cron: '30 1 * * 1'

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'actions']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
