# The benchctl pipeline.
#
# This file is the pipeline; the scenario files are the entry points. Each
# scenario has its own workflow next to this one (prom-load.yml, pg-load.yml,
# fs.yml) and calls this file with `uses:`. That split is what makes the
# scenarios independent:
#
#   - each one has its own timeout, its own concurrency group and its own
#     artifact retention, so a filesystem run cannot eat the budget of a
#     Prometheus run
#   - a scenario that needs the filesystem tooling asks for it, instead of
#     every run installing packages it does not use
#   - adding a benchmark is one new workflow file and one new yaml under
#     benchctl/scenarios/ — the pipeline below does not change
#
# The pipeline body lives here exactly once. A step that exists in two
# copies is a step that exists in one version.

name: benchmark

on:
  workflow_call:
    inputs:
      scenario:
        description: Scenario file under benchctl/scenarios/, without .yaml
        required: true
        type: string
      publish:
        description: Open a PR with the results
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: How long the job may run
        required: false
        default: 60
        type: number
      artifact_days:
        description: How long the results artifact is kept
        required: false
        default: 90
        type: number

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    # One run of the same scenario at a time. Two concurrent benches would
    # measure each other. Different scenarios may run at the same time:
    # they are different measurements.
    concurrency:
      group: benchmark-${{ inputs.scenario }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write

    env:
      BENCH_RUN_ID: gh-${{ github.run_number }}.${{ github.run_attempt }}
      BENCH_COMMIT: ${{ github.sha }}

    steps:
      - name: Clean workspace
        run: |
          rm -rf ${{ github.workspace }}/benchctl 2>/dev/null || true
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Verify checkout
        run: |
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Current branch: $(git branch --show-current)"
          echo "Files in benchctl/driver/: $(ls benchctl/driver/)"
          head -20 benchctl/driver/run.py | tail -10

      - name: Report runner capacity
        # The envelope is only meaningful if the machine can honour it. Fail
        # loudly rather than silently measuring the runner instead of the
        # system under test.
        run: |
          echo "cpus: $(nproc)"
          free -g | head -2
          df -h "$RUNNER_TEMP" | tail -1

      - name: Select scenario
        # The scenario is a file in benchctl/scenarios/. Fail loudly when it
        # is missing: a scenario that silently does not exist would run
        # whatever is on disk.
        run: |
          SCENARIO="scenarios/${{ inputs.scenario }}.yaml"
          if [ ! -f "benchctl/$SCENARIO" ]; then
            echo "::error::no such scenario file: benchctl/$SCENARIO"
            ls benchctl/scenarios/ || true
            exit 1
          fi
          echo "SCENARIO=$SCENARIO" >> "$GITHUB_ENV"
          echo "running $SCENARIO"

      - name: Install driver deps
        # The driver runs on the runner (not in a container): it generates
        # plan.json + compose and shells out to docker. numpy/cramjam build
        # the dataset; pyyaml reads scenario + module files; psycopg for
        # postgres init.
        run: pip install numpy cramjam pyyaml 'psycopg[binary]'

      - name: Install filesystem tools
        # Only the filesystem scenario formats real filesystems on the
        # runner's loop devices, so only it needs the tools that do it:
        # xfsprogs and btrfs-progs are not preinstalled, and ZFS needs its
        # kernel module, which on the runner's kernel comes from
        # linux-modules-extra rather than from the kernel image the runner
        # booted.
        #
        # The extra-modules package is best effort: it does not exist for
        # every kernel a runner might boot, and a missing ZFS module is
        # recorded as a gap in the results, not as a failed run.
        if: inputs.scenario == 'fs'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            e2fsprogs xfsprogs btrfs-progs zfsutils-linux fio
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" \
            || echo "::warning::no linux-modules-extra for kernel $(uname -r)"
          sudo modprobe loop || true
          sudo modprobe zfs || true
          echo "loop devices: $(ls /dev/loop* 2>/dev/null | wc -l)"
          echo "zfs module: $(lsmod | grep -c '^zfs' || true)"

      - name: Run the benchmark
        # Start from an empty results/, not just missing files. A run that
        # dies after init would otherwise leave a previous summary.json in
        # place and verify would pass on stale numbers as if they were fresh.
        #
        # GRAFANA_CLOUD_RW_URL is empty unless the secrets below exist (fork
        # PRs get no secrets). k6 then logs a connection-refused warning per
        # flush interval and keeps measuring locally; the local summary.json
        # is still the record. An empty URL must stay distinguishable from a
        # deliberately skipped push, so the verify output records which it was.
        env:
          GRAFANA_CLOUD_RW_URL: ${{ secrets.GRAFANA_CLOUD_URL }}
          GRAFANA_CLOUD_RW_USER: ${{ secrets.GRAFANA_CLOUD_ID }}
          GRAFANA_CLOUD_RW_PASS: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        working-directory: benchctl
        run: |
          rm -rf results plan.json docker-compose.gen.yml compose.gen.json
          mkdir -p results
          export BENCHCTL_SCENARIO="$SCENARIO"
          python3 driver/run.py "$SCENARIO"
          python3 verify/check.py

      - name: Tear down
        # Always, even on failure. The SUT is downed per leg by the driver,
        # but the monitoring stack stays up through verify by design, so it
        # is stopped here. Both compose binaries: the runner has `docker
        # compose`, dev machines may only have `docker-compose`.
        if: always()
        working-directory: benchctl
        run: |
          (docker compose -f ../monitoring/compose.monitoring.yml down -v || docker-compose -f ../monitoring/compose.monitoring.yml down -v) 2>/dev/null || true
          docker network rm benchctl-mon 2>/dev/null || true

      - name: Tear down the filesystems
        # The filesystem scenario mounts filesystems on the runner. If the
        # run died mid-leg, the mount and the loop device are still there.
        # Only detach ours: `losetup -D` would take every loop device on
        # the runner with it.
        if: always() && inputs.scenario == 'fs'
        run: |
          sudo umount /mnt/benchctl-fs/mnt/* 2>/dev/null || true
          for dev in $(sudo losetup -a | grep benchctl-fs | cut -d: -f1); do
            sudo losetup -d "$dev" 2>/dev/null || true
          done
          sudo rm -rf /mnt/benchctl-fs 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.scenario }}-${{ github.run_number }}
          path: benchctl/results/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_days }}

      - name: Summarise
        if: always()
        working-directory: benchctl
        run: |
          echo "### benchctl summary" >> "$GITHUB_STEP_SUMMARY"
          for f in results/disk-*.json results/verify.json; do
            if [ -f "$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -f results/summary.json ]; then
            python3 verify/summarise.py >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no k6 summary produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Opens a PR rather than pushing to main. Results are evidence, so a run
      # landing on main should be a diff somebody can read rather than a push.
      - name: Open a PR with the results
        if: inputs.publish
        uses: actions/github-script@v7
        with:
          script: |
            const branch = `bench/run-${{ github.run_number }}-${{ inputs.scenario }}`;
            const cwd = process.env.GITHUB_WORKSPACE;
            const { execSync } = require('child_process');

            const run = (cmd) => execSync(cmd, { cwd, encoding: 'utf8' });

            run(`git config user.name  "github-actions[bot]"`);
            run(`git config user.email "41898282+github-actions[bot]@users.noreply.github.com"`);

            const base = process.env.GITHUB_REF_NAME || 'main';
            run(`git checkout -b ${branch}`);
            run(`git add benchctl/results`);

            // Nothing changed: the recorded run reproduces exactly.
            const staged = run(`git diff --cached --name-only`).trim();
            if (!staged) {
              core.info('results/ is byte-identical to main; nothing to open.');
              return;
            }

            const scenario = '${{ inputs.scenario }}';
            run(`git commit -m "bench: results from run ${{ github.run_number }} (${scenario})"`);
            run(`git push --force origin ${branch}`);

            const body = [
              `Automated results from run ${{ github.run_number }} (${scenario} scenario).`,
              '',
              `Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              '',
              'The system under test is on `:latest`. If these numbers differ',
              'from the previous run, the cause is upstream image drift.',
            ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: base,
              head: branch,
              title: `bench: results from run ${{ github.run_number }} (${scenario})`,
              body,
            });
            core.info(`Opened PR #${pr.number}: ${pr.html_url}`);
