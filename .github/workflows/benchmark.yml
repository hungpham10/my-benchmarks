# benchctl pipeline.
#
# Three ways in, deliberately different:
#
#   pull_request  smoke only (scenarios/smoke.yaml, ~2 min). Validates that a
#                 change still runs end to end. A full run would make every PR
#                 unusable.
#   schedule      nightly full (scenarios/counter-rate.yaml), to catch upstream
#                 drift in the `:latest` images.
#   dispatch      manual, full by default, for a deliberate run.
#
# The system under test is on `:latest`, so numbers describe whatever the tag
# resolved to on the day. That is why the nightly run exists at all.

name: benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/benchmark.yml'
      - 'benchctl/**'
  schedule:
    # 03:17 UTC. Off the hour so it does not queue behind everyone else's
    # midnight jobs.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scale:
        description: Benchmark scale
        type: choice
        options: [smoke, load, pg, fs, full]
        default: full
      publish:
        description: Open a PR with the results
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run at a time. Two concurrent benches would measure each other.
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fs-smoke:
    # The filesystem path is only exercised by the fs scenarios: it formats
    # real filesystems on the runner's loop devices and bind-mounts them into
    # the container's data directory. A PR check that skipped it would let
    # that rot until a nightly run noticed. Separate job, separate runner,
    # separate results/ — two scenarios in one results directory would have
    # the parity check comparing datasets that were never meant to match.
    #
    # Skipped when the main job is already running the filesystem matrix:
    # same code path, four times the data.
    if: github.event_name != 'workflow_dispatch' || inputs.scale != 'fs'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      BENCH_RUN_ID: gh-${{ github.run_number }}.${{ github.run_attempt }}-fssmoke

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Install filesystem tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            e2fsprogs xfsprogs btrfs-progs zfsutils-linux fio
          sudo modprobe loop || true
          sudo modprobe zfs || true

      - name: Install driver deps
        run: pip install numpy cramjam pyyaml 'psycopg[binary]'

      - name: Run the filesystem smoke check
        working-directory: benchctl
        run: |
          rm -rf results plan.json docker-compose.gen.yml compose.gen.json
          mkdir -p results
          python3 driver/run.py scenarios/fs-smoke.yaml
          python3 verify/check.py

      - name: Tear down
        if: always()
        run: |
          sudo umount /mnt/benchctl-fs/mnt/* 2>/dev/null || true
          for dev in $(sudo losetup -a | grep benchctl-fs | cut -d: -f1); do
            sudo losetup -d "$dev" 2>/dev/null || true
          done
          sudo rm -rf /mnt/benchctl-fs 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-smoke-results-${{ github.run_number }}
          path: benchctl/results/
          if-no-files-found: error
          retention-days: 90

  bench:
    runs-on: ubuntu-latest
    # Full scale: up + init (3.6M samples) + k6 ramp (~14 min) + verify.
    # load-test is ~10 min + init + verify. Keep 120 for safety.
    timeout-minutes: 120

    # No default working directory; steps specify their own

    permissions:
      contents: write
      pull-requests: write

    env:
      BENCH_RUN_ID: gh-${{ github.run_number }}.${{ github.run_attempt }}
      BENCH_COMMIT: ${{ github.sha }}

    steps:
      - name: Clean workspace
        run: |
          rm -rf ${{ github.workspace }}/benchctl 2>/dev/null || true
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Verify checkout
        run: |
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Current branch: $(git branch --show-current)"
          echo "Files in benchctl/driver/: $(ls benchctl/driver/)"
          head -20 benchctl/driver/run.py | tail -10

      - name: Report runner capacity
        # The envelope is only meaningful if the machine can honour it. Fail
        # loudly rather than silently measuring the runner instead of the
        # system under test.
        run: |
          echo "cpus: $(nproc)"
          free -g | head -2
          df -h "$RUNNER_TEMP" | tail -1

      - name: Select scenario
        # A pull request never runs full, whatever the inputs say.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'SCENARIO=scenarios/smoke.yaml' >> "$GITHUB_ENV"
            echo "smoke (pull_request)"
          elif [ "${{ inputs.scale }}" = "smoke" ]; then
            echo 'SCENARIO=scenarios/smoke.yaml' >> "$GITHUB_ENV"
            echo "smoke (dispatch)"
          elif [ "${{ inputs.scale }}" = "load" ]; then
            echo 'SCENARIO=scenarios/load-test.yaml' >> "$GITHUB_ENV"
            echo "load-test (dispatch)"
          elif [ "${{ inputs.scale }}" = "pg" ]; then
            echo 'SCENARIO=scenarios/load-test-pg.yaml' >> "$GITHUB_ENV"
            echo "load-test-pg (dispatch)"
          elif [ "${{ inputs.scale }}" = "fs" ]; then
            echo 'SCENARIO=scenarios/fs-matrix.yaml' >> "$GITHUB_ENV"
            echo "fs-matrix (dispatch)"
          else
            echo 'SCENARIO=scenarios/counter-rate.yaml' >> "$GITHUB_ENV"
            echo "full"
          fi

      - name: Install driver deps
        # The driver runs on the runner (not in a container): it generates
        # plan.json + compose and shells out to docker. numpy/cramjam build
        # the dataset; pyyaml reads scenario + module files; psycopg for
        # postgres init.
        run: pip install numpy cramjam pyyaml 'psycopg[binary]'

      - name: Install filesystem tools
        # The filesystem matrix formats real filesystems on the runner's loop
        # devices, so the tools that do it have to be there: xfsprogs and
        # btrfs-progs are not preinstalled, and ZFS needs its kernel module,
        # which on the runner's kernel comes from linux-modules-extra rather
        # than from the kernel image the runner booted.
        #
        # The extra-modules package is best effort: it does not exist for
        # every kernel a runner might boot, and a missing ZFS module is
        # recorded as a gap in the results, not as a failed run.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            e2fsprogs xfsprogs btrfs-progs zfsutils-linux fio
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" \
            || echo "::warning::no linux-modules-extra for kernel $(uname -r)"
          sudo modprobe loop || true
          sudo modprobe zfs || true
          echo "loop devices: $(ls /dev/loop* 2>/dev/null | wc -l)"
          echo "zfs module: $(lsmod | grep -c '^zfs' || true)"

      - name: Run the benchmark
        # Start from an empty results/, not just missing files. A run that
        # dies after init would otherwise leave a previous summary.json in
        # place and verify would pass on stale numbers as if they were fresh.
        #
        # GRAFANA_CLOUD_RW_URL is empty unless the secrets below exist (fork
        # PRs get no secrets). k6 then logs a connection-refused warning per
        # flush interval and keeps measuring locally; the local summary.json
        # is still the record. An empty URL must stay distinguishable from a
        # deliberately skipped push, so the verify output records which it was.
        env:
          GRAFANA_CLOUD_RW_URL: ${{ secrets.GRAFANA_CLOUD_URL }}
          GRAFANA_CLOUD_RW_USER: ${{ secrets.GRAFANA_CLOUD_ID }}
          GRAFANA_CLOUD_RW_PASS: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        working-directory: benchctl
        run: |
          rm -rf results plan.json docker-compose.gen.yml compose.gen.json
          mkdir -p results
          export BENCHCTL_SCENARIO="$SCENARIO"
          python3 driver/run.py "$SCENARIO"
          python3 verify/check.py

      - name: Tear down
        # Always, even on failure. The SUT is downed per leg by the driver,
        # but the monitoring stack stays up through verify by design, so it
        # is stopped here. Both compose binaries: the runner has `docker
        # compose`, dev machines may only have `docker-compose`.
        if: always()
        working-directory: benchctl
        run: |
          (docker compose -f ../monitoring/compose.monitoring.yml down -v || docker-compose -f ../monitoring/compose.monitoring.yml down -v) 2>/dev/null || true
          docker network rm benchctl-mon 2>/dev/null || true
          # The filesystem matrix mounts filesystems on the runner. If the
          # run died mid-leg, the mount and the loop device are still there.
          # Only detach ours: `losetup -D` would take every loop device on
          # the runner with it.
          sudo umount /mnt/benchctl-fs/mnt/* 2>/dev/null || true
          for dev in $(sudo losetup -a | grep benchctl-fs | cut -d: -f1); do
            sudo losetup -d "$dev" 2>/dev/null || true
          done
          sudo rm -rf /mnt/benchctl-fs 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_number }}
          path: benchctl/results/
          if-no-files-found: error
          retention-days: 90

      - name: Summarise
        if: always()
        working-directory: benchctl
        run: |
          echo "### benchctl summary" >> "$GITHUB_STEP_SUMMARY"
          for f in results/disk-*.json results/verify.json; do
            if [ -f "$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -f results/summary.json ]; then
            python3 verify/summarise.py >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no k6 summary produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Opens a PR rather than pushing to main. Results are evidence, so a run
      # landing on main should be a diff somebody can read rather than a push.
      - name: Open a PR with the results
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/github-script@v7
        with:
          script: |
            const branch = `bench/run-${{ github.run_number }}`;
            const cwd = process.env.GITHUB_WORKSPACE;
            const { execSync } = require('child_process');

            const run = (cmd) => execSync(cmd, { cwd, encoding: 'utf8' });

            run(`git config user.name  "github-actions[bot]"`);
            run(`git config user.email "41898282+github-actions[bot]@users.noreply.github.com"`);

            const base = process.env.GITHUB_REF_NAME || 'main';
            run(`git checkout -b ${branch}`);
            run(`git add benchctl/results`);

            // Nothing changed: the recorded run reproduces exactly.
            const staged = run(`git diff --cached --name-only`).trim();
            if (!staged) {
              core.info('results/ is byte-identical to main; nothing to open.');
              return;
            }

            const scale = '${{ inputs.scale }}';
            run(`git commit -m "bench: results from run ${{ github.run_number }} (${scale})"`);
            run(`git push --force origin ${branch}`);

            const body = [
              `Automated results from run ${{ github.run_number }} (${scale} scale).`,
              '',
              `Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              '',
              'The system under test is on `:latest`. If these numbers differ',
              'from the previous run, the cause is upstream image drift.',
            ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: base,
              head: branch,
              title: `bench: results from run ${{ github.run_number }} (${scale})`,
              body,
            });
            core.info(`Opened PR #${pr.number}: ${pr.html_url}`);
